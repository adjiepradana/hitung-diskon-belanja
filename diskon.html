<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

        <div class="container">
            <div class="card">
            <h1>Hitung Diskon Belanja</h1>
            <p>Total Belanja > Rp. 100000 = Diskon 10%</p>
            <p>Total Belanja > Rp. 200000 = Diskon 20%</p>

            <div class="input-group">
                <input type="Number" id="barang1" required>
                <label for="barang1">Harga Barang 1</label>
            </div>
            <div class="input-group">
                <input type="Number" id="barang2" required>
                <label for="barang2">Harga Barang 2</label>
            </div>
            <div class="input-group">
                <input type="Number" id="barang3" required>
                <label for="barang3">Harga Barang 3</label>
            </div>
            <div class="input-group">
                <input type="Number" id="barang4" required>
                <label for="barang4">Harga Barang 4</label>
            </div>
            <div class="input-group">
                <input type="Number" id="barang5" required>
                <label for="barang5">Harga Barang 5</label>
            </div>

            <button onclick="hitungDiskonBelanja()">Hitung</button>
            <button onclick="logout()">Logout</button>
            </div>

        </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
