<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Diskon Belanja</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <h1>Hitung Diskon Belanja </h1>
        <p>Total Belanja > Rp. 100000 = Diskon 10%</p>
        <p>Total Belanja > Rp. 200000 = Diskon 20%</p>

        <div class="form-group">
            <label for="barang1">Harga Barang 1</label>
            <input type="number" id="barang1" placeholder="Masukkan Harga Barang Pertama">
        </div>
        <div class="form-group">
            <label for="barang2">Harga Barang 2</label>
            <input type="number" id="barang2" placeholder="Masukkan Harga Barang Kedua">
        </div>
        <div class="form-group">
            <label for="barang3">Harga Barang 3</label>
            <input type="number" id="barang3" placeholder="Masukkan Harga Barang Ketiga">
        </div>
        <div class="form-group">
            <label for="barang4">Harga Barang 4</label>
            <input type="number" id="barang4" placeholder="Masukkan Harga Barang Keempat">
        </div>
        <div class="form-group">
            <label for="barang5">Harga Barang 5</label>
            <input type="number" id="barang5" placeholder="Masukkan Harga Barang Kelima">
        </div>

        <button onclick="hitungDiskonBelanja()">Hitung Total Belanja</button>
        <button onclick="logout()">Logout</button>
    </div>



    <!-- Javascript -->
    <script src="script.js"></script>

    <!-- Sweet Alert -->
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
